<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MH Time Tracker</title>
<style>
:root{
  --bg:#f6f6f6;--card:#fff;--input:#f0f0f0;--text:#171717;--muted:#737373;
  --border:#d4d4d4;--timer:#171717;--accent:#16a34a;--accent-hover:#15803d;
  --button:#fff;--button-hover:#ededed;--accent-bg:#dcfce7;--danger:#dc2626;
}
:root.dark{
  --bg:#151515;--card:#202020;--input:#181818;--text:#f5f5f5;--muted:#a3a3a3;
  --border:#3a3a3a;--timer:#fff;--accent:#22c55e;--accent-hover:#16a34a;
  --button:#242424;--button-hover:#2e2e2e;--accent-bg:#12351f;--danger:#ef4444;
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
body{min-height:100%}
button,input{font:inherit}
.app{width:100%;max-width:820px;margin:0 auto;padding:8px 12px 12px;background:var(--bg)}

.timerbar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:7px;min-height:68px;
}
.timer{
  grid-column:2;color:var(--timer);font-variant-numeric:tabular-nums;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:clamp(34px,7.2vw,64px);font-weight:600;
  letter-spacing:clamp(-3px,-.32vw,-1.5px);line-height:1;white-space:nowrap;
}
.theme-slot{grid-column:1;display:flex;justify-content:flex-start;align-items:center}
.theme-btn{
  width:32px;height:29px;padding:0;border:1px solid var(--border);
  background:var(--button);color:var(--text);border-radius:8px;cursor:pointer;line-height:1;
}
.theme-btn:hover{background:var(--button-hover)}

.task-area{margin-top:2px;margin-bottom:9px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text]{
  width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:14px;outline:none;
}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]:disabled{opacity:.9}
.actions{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap;margin-top:7px;white-space:nowrap}
button.action{
  border:1px solid var(--border);background:var(--button);color:var(--text);
  border-radius:7px;padding:6px 9px;font-size:11px;cursor:pointer;min-height:32px;
}
.preset-select{
  max-width:120px;border:1px solid var(--border);background:var(--button);color:var(--text);
  border-radius:7px;padding:6px 7px;font-size:11px;min-height:32px;cursor:pointer;
}
.preset-control{position:relative;display:flex;align-items:center}
.preset-control{gap:3px}
.preset-control button{width:28px;height:28px;padding:0;border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:5px;font-size:13px;cursor:pointer}
.preset-control button:hover{background:var(--button-hover)}
.preset-control .delete-preset:hover{color:var(--danger)}
.preset-select.saved{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.preset-name-input{
  width:120px;max-width:120px;border:1px solid var(--accent);background:var(--input);color:var(--text);
  border-radius:7px;padding:6px 7px;font-size:11px;min-height:32px;outline:none;
}
button.action:hover{background:var(--button-hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover)}
button:disabled{opacity:.42;cursor:not-allowed}
.total-inline{
  display:flex;align-items:center;gap:5px;margin-left:auto;
  color:var(--muted);font-size:11px;white-space:nowrap;
}
.total-inline strong{
  color:var(--text);font-variant-numeric:tabular-nums;
  font-family:"SFMono-Regular",Consolas,monospace;
}
@media(max-width:700px){
  .total-inline{margin-left:0}
}
@media(max-width:440px){
  .total-inline{font-size:10px}
}
.status{text-align:center;color:var(--muted);font-size:10px;min-height:13px;margin:4px 0 0}

.section{border-top:1px solid var(--border);padding-top:9px;margin-top:2px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.log{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;
  gap:4px 5px;align-items:center;min-width:0;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 7px;
  transition:border-color .12s,background .12s,box-shadow .12s;
}
.row{cursor:grab}
.row:active{cursor:grabbing}
.row.selected{
  border-color:var(--accent);background:var(--accent-bg);
  box-shadow:0 0 0 1px rgba(34,197,94,.12);
}
.row.running{
  border:2px solid var(--accent);padding:5px 6px;background:var(--accent-bg);
  box-shadow:0 0 0 2px rgba(34,197,94,.13);
  cursor:default;
}
.name{min-width:0;grid-column:1}
.name input{padding:4px 6px;font-size:12px}
.name-text{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.running .name-text{font-weight:700}
.row.drag-over{outline:2px dashed var(--accent);outline-offset:1px}
.duration{
  grid-column:2;grid-row:1;font-variant-numeric:tabular-nums;
  font-family:"SFMono-Regular",Consolas,monospace;color:var(--text);
  font-size:10px;white-space:nowrap;
}
.row.running .duration{color:var(--accent);font-weight:800}
.row.running .duration::before{content:"● ";font-size:6px}
.duration input{width:76px;padding:3px 4px;font-size:10px;text-align:right}
.row-actions{
  grid-column:1/-1;grid-row:2;display:flex;gap:3px;justify-content:flex-end;
}
.row-actions button{
  width:26px;height:26px;padding:0;border:1px solid var(--border);
  background:var(--button);color:var(--text);border-radius:6px;cursor:pointer;
}
.row-actions button:hover{background:var(--button-hover)}
.row-actions button.is-running{
  color:#fff;background:var(--accent);border-color:var(--accent);
  font-weight:800;box-shadow:0 0 0 2px var(--accent-bg);
}
.row-actions button.delete:hover{color:var(--danger);border-color:var(--danger)}
.total{
  display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:10px
}
.total strong{
  color:var(--text);font-variant-numeric:tabular-nums;
  font-family:"SFMono-Regular",Consolas,monospace;
}
.bottom{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}
.bottom button{
  border:1px solid var(--border);background:var(--button);color:var(--text);
  border-radius:6px;font-size:9px;padding:5px 7px;cursor:pointer
}
.bottom button:hover{background:var(--button-hover)}
.empty{color:var(--muted);font-size:10px;padding:6px 1px;grid-column:1/-1}
.toast{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
  background:var(--text);color:var(--bg);border-radius:7px;padding:6px 9px;
  font-size:10px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10
}
.toast.show{opacity:1}

@media(max-width:700px){
  .app{padding:7px 10px 10px}
  .timerbar{min-height:60px}
  .timer{font-size:clamp(31px,9vw,52px)}
  .log{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{flex-wrap:wrap}
}
@media(max-width:440px){
  .app{padding:7px 8px 9px}
  .timerbar{min-height:52px}
  .timer{font-size:clamp(27px,9.8vw,40px);letter-spacing:-2px}
  .theme-btn{width:29px;height:27px}
  input[type=text]{font-size:12px;padding:7px 8px}
  button.action{font-size:10px;padding:5px 7px;min-height:30px}
  .log{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="tracker">
  <div class="timerbar">
    <div class="theme-slot">
      <button class="theme-btn" id="theme" type="button" aria-label="Switch to dark mode">☾</button>
    </div>
    <div class="timer" id="timer">00:00:00.00</div>
    <div></div>
  </div>

  <div class="task-area">
    <label for="task">Task</label>
    <input id="task" type="text" maxlength="120" placeholder="e.g. Rigging" autocomplete="off">
    <div class="actions">
      <button id="start" class="action primary" type="button">▶ Start</button>
      <button id="save" class="action" type="button" disabled>Create</button>
      <div class="preset-control">
        <select id="presetSelect" class="preset-select" aria-label="Choose a work-log preset"><option value="">MH 01</option></select>
        <button id="createPreset" type="button" title="Create preset" aria-label="Create preset">＋</button>
        <button id="savePreset" type="button" title="Save preset" aria-label="Save preset">▣</button>
        <button id="duplicatePreset" type="button" title="Copy preset" aria-label="Copy preset">⧉</button>
        <button id="renamePreset" type="button" title="Rename preset" aria-label="Rename preset">✎</button>
        <button id="deletePreset" class="delete-preset" type="button" title="Delete preset" aria-label="Delete preset">×</button>
      </div>
      <div class="total-inline"><span>Total</span><strong id="total">00:00:00.00</strong></div>
      <button id="copyLog" class="action" type="button">Copy Log</button>
      <button id="copyTable" class="action" type="button">Copy Table</button>
      <button id="resetLog" class="action" type="button">Reset Log</button>
      <button id="clear" class="action" type="button">Clear Log</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <section class="section">
    <div class="section-title">WORK LOG</div>
    <div class="log" id="log"></div>

  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(()=>{
 "use strict";
 const KEY="mh-time-tracker-v6", OLD_KEYS=["mh-time-tracker-v4","mh-time-tracker-v3","mh-time-tracker-v2","mh-time-tracker-v1"];
 const $=id=>document.getElementById(id);
 const taskInput=$("task"),timerEl=$("timer"),startBtn=$("start"),saveBtn=$("save"),savePresetBtn=$("savePreset"),createPresetBtn=$("createPreset"),duplicatePresetBtn=$("duplicatePreset"),presetSelect=$("presetSelect"),renamePresetBtn=$("renamePreset"),deletePresetBtn=$("deletePreset"),statusEl=$("status"),logEl=$("log"),totalEl=$("total"),toastEl=$("toast"),themeBtn=$("theme");
 let state=loadState();
 let running=Boolean(state.active?.running);
 let startedAt=Number(state.active?.startedAt)||0;
 let baseSeconds=Number(state.active?.baseSeconds)||0;
 let activeSource=state.active?.source==="existing"?"existing":"new";
 let activeEntryId=state.active?.entryId||"";
 let selectedEntryId=activeSource==="existing" ? activeEntryId : "";
 let dragId="";
 let raf=0,toastTimer=0,theme=loadTheme();

 function normalize(data){
   if(!data||!Array.isArray(data.entries)) return null;
   const presets=Array.isArray(data.presets)?data.presets.map(p=>({
     id:String(p.id||makeId()),name:String(p.name||"Untitled preset"),
     entries:Array.isArray(p.entries)?p.entries.map(e=>({name:String((e&&typeof e==="object"?e.name:e)||"Untitled"),seconds:Math.max(0,Number(e&&typeof e==="object"?e.seconds:0)||0)})).filter(e=>e.name.trim()):[]
   })):[];
   const currentPresetId=presets.some(p=>p.id===String(data.currentPresetId||""))?String(data.currentPresetId):"";
   const currentPresetName=currentPresetId?presets.find(p=>p.id===currentPresetId).name:String(data.currentPresetName||"MH 01");
   return {entries:data.entries.map(e=>({id:String(e.id||makeId()),name:String(e.name||"Untitled"),seconds:Math.max(0,Number(e.seconds)||0)})),active:data.active||null,presets,currentPresetId,currentPresetName};
 }
 function loadState(){
   try{
     let raw=localStorage.getItem(KEY); if(raw){const d=normalize(JSON.parse(raw));if(d)return d;}
     for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw){const d=normalize(JSON.parse(raw));if(d)return d;}}
   }catch(e){}
   return {entries:[],active:null,presets:[],currentPresetId:"",currentPresetName:"MH 01"};
 }
 function persist(){try{localStorage.setItem(KEY,JSON.stringify({entries:state.entries,presets:state.presets,currentPresetId:state.currentPresetId,currentPresetName:state.currentPresetName,active:(running||baseSeconds>0||activeEntryId)?{running,startedAt,baseSeconds,source:activeSource,entryId:activeEntryId}:null}));}catch(e){}}
 function loadTheme(){try{const s=localStorage.getItem("mh-time-tracker-theme");if(s==="dark"||s==="light")return s;}catch(e){}return "light";}
 function applyTheme(){document.documentElement.classList.toggle("dark",theme==="dark");themeBtn.textContent=theme==="dark"?"☀":"☾";themeBtn.setAttribute("aria-label",theme==="dark"?"Switch to light mode":"Switch to dark mode");try{localStorage.setItem("mh-time-tracker-theme",theme);}catch(e){}}
 function fmt(seconds){seconds=Math.max(0,Number(seconds)||0);let hh=Math.floor((seconds%1)*100);let w=Math.floor(seconds),s=w%60;w=Math.floor(w/60);let m=w%60,h=Math.floor(w/60);return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":")+"."+String(hh).padStart(2,"0");}
 function fmtShort(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));let s=seconds%60,tm=Math.floor(seconds/60),m=tm%60,h=Math.floor(tm/60),p=[];if(h)p.push(h+"h");if(m||h)p.push(m+"m");if(!h&&!m)p.push(s+"s");else if(s)p.push(s+"s");return p.join(" ");}
 function fmtInputTime(seconds){seconds=Math.max(0,Math.floor(Number(seconds)||0));const s=seconds%60,m=Math.floor(seconds/60)%60,h=Math.floor(seconds/3600);return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");}
 function parseInputTime(value){
   const text=String(value||"").trim();
   if(/^\d+(?:\.\d+)?$/.test(text))return Number(text);
   const parts=text.split(":");if(parts.length<2||parts.length>3||parts.some(p=>!/^\d+(?:\.\d+)?$/.test(p)))return null;
   const values=parts.map(Number);if(values.slice(1).some(v=>v>=60))return null;
   return parts.length===2?values[0]*60+values[1]:values[0]*3600+values[1]*60+values[2];
 }
 function presetName(){return state.currentPresetName||"MH 01";}
 function snapshotEntries(){
   const elapsed=currentSeconds();
   if(activeSource==="existing"&&activeEntryId){const active=state.entries.find(e=>e.id===activeEntryId);if(active)active.seconds=elapsed;}
   return state.entries.map(e=>({name:e.name,seconds:Math.max(0,Number(e.seconds)||0)}));
 }
 function saveCurrentPreset(){
   if(!state.currentPresetId)return;
   if(activeSource==="new"&&taskInput.value.trim()&&currentSeconds()>0)flushPausedSession();
   const preset=state.presets.find(p=>p.id===state.currentPresetId);if(preset)preset.entries=snapshotEntries();
 }
 function renderPresets(){
   presetSelect.innerHTML="";
   if(!state.presets.length){const defaultOption=document.createElement("option");defaultOption.value="";defaultOption.textContent=presetName();presetSelect.appendChild(defaultOption);}
   state.presets.forEach(p=>{const option=document.createElement("option");option.value=p.id;option.textContent=p.name;presetSelect.appendChild(option);});
   if(state.currentPresetId)presetSelect.value=state.currentPresetId;
 }
 function savePreset(){
   if(!state.entries.length){toast("Add at least one task first.");return;}
   if(!state.currentPresetId){const id=makeId();state.presets.push({id,name:presetName(),entries:[]});state.currentPresetId=id;}
   saveCurrentPreset();persist();renderPresets();presetSelect.classList.add("saved");setTimeout(()=>presetSelect.classList.remove("saved"),1100);toast("Preset saved.");
 }
 function nextPresetName(){
   const used=new Set(state.presets.map(p=>{const match=p.name.trim().match(/^MH\s*(\d+)$/i);return match?Number(match[1]):0;}));let number=1;
   while(used.has(number))number++;
   return "MH "+String(number).padStart(2,"0");
 }
 function createPreset(){
   saveCurrentPreset();
   const id=makeId(),name=nextPresetName();
   state.presets.push({id,name,entries:[]});state.currentPresetId=id;state.currentPresetName=name;state.entries=[];
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();
   persist();render();renderPresets();renderTimer();updateButtons();renamePreset();
 }
 function duplicatePreset(){
   saveCurrentPreset();
   const entries=snapshotEntries(),id=makeId(),name=nextPresetName();
   state.presets.push({id,name,entries:entries.map(e=>({name:e.name,seconds:e.seconds}))});
   state.currentPresetId=id;state.currentPresetName=name;state.entries=entries.map(e=>({id:makeId(),name:e.name,seconds:e.seconds}));
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();
   persist();render();renderPresets();renderTimer();updateButtons();toast("Preset copied.");
 }
 function loadPreset(id){
   if(id===state.currentPresetId)return;
   saveCurrentPreset();
   const preset=state.presets.find(p=>p.id===id);
   state.entries=preset?preset.entries.map(e=>({id:makeId(),name:e.name,seconds:Math.max(0,Number(e.seconds)||0)})):[];
   state.currentPresetId=preset?.id||"";
   state.currentPresetName=preset?.name||"MH 01";
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";
   stopFrame();persist();render();renderPresets();renderTimer();updateButtons();setStatus("");
 }
 function renamePreset(){
   if(presetSelect.hidden)return;
   const input=document.createElement("input");input.type="text";input.maxLength=120;input.value=presetName();input.className="preset-name-input";input.setAttribute("aria-label","Preset name");
   presetSelect.hidden=true;presetSelect.before(input);input.focus();input.select();
   let done=false;
   const finish=save=>{
     if(done)return;done=true;
     const clean=input.value.trim();input.remove();presetSelect.hidden=false;
     if(save&&clean){state.currentPresetName=clean;const preset=state.presets.find(p=>p.id===state.currentPresetId);if(preset)preset.name=clean;persist();renderPresets();toast("Preset renamed.");}
     else if(save&&!clean){renderPresets();toast("Preset name is required.");}
   };
   input.addEventListener("keydown",ev=>{if(ev.key==="Enter")finish(true);else if(ev.key==="Escape")finish(false);});
   input.addEventListener("blur",()=>finish(true));
 }
 function deletePreset(){
   const preset=state.presets.find(p=>p.id===state.currentPresetId);if(!preset)return;
   state.presets=state.presets.filter(p=>p.id!==preset.id);
   const next=state.presets[0];state.currentPresetId=next?.id||"";state.currentPresetName=next?.name||"MH 01";
   state.entries=next?next.entries.map(e=>({id:makeId(),name:e.name,seconds:Math.max(0,Number(e.seconds)||0)})):[];
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();
   persist();render();renderPresets();renderTimer();updateButtons();toast("Preset deleted.");
 }
 function currentSeconds(){return running?Math.max(0,baseSeconds+(Date.now()-startedAt)/1000):Math.max(0,baseSeconds);}
 function displaySeconds(){
   if(running||baseSeconds>0)return currentSeconds();
   if(selectedEntryId){const e=state.entries.find(x=>x.id===selectedEntryId);if(e)return Math.max(0,Number(e.seconds)||0);}
   return 0;
 }
 function syncActiveEntry(seconds=currentSeconds()){
   if(activeSource!=="existing"||!activeEntryId)return false;
   const e=state.entries.find(x=>x.id===activeEntryId);if(!e)return false;
   e.seconds=Math.max(0,Number(seconds)||0);
   const name=taskInput.value.trim();if(name)e.name=name;
   return true;
 }
 function flushPausedSession(){
   const seconds=currentSeconds();if(seconds<=0)return false;
   if(syncActiveEntry(seconds)){persist();return true;}
   const name=taskInput.value.trim();if(!name)return false;
   const id=makeId();
   state.entries.push({id,name,seconds});
   activeSource="existing";activeEntryId=id;selectedEntryId=id;
   baseSeconds=seconds;startedAt=0;
   persist();
   return true;
 }
 function stopFrame(){if(raf){cancelAnimationFrame(raf);raf=0;}}
 function setStatus(t=""){statusEl.textContent=t;}
 function renderTimer(){timerEl.textContent=fmt(displaySeconds());if(running)raf=requestAnimationFrame(renderTimer);}

 function startNew(){
   const name=taskInput.value.trim();if(!name){setStatus("Enter a task name first.");taskInput.focus();return;}
   if(selectedEntryId){
     const e=state.entries.find(x=>x.id===selectedEntryId);
     if(e){
       activeSource="existing";activeEntryId=e.id;baseSeconds=Math.max(0,Number(e.seconds)||0);
       startedAt=Date.now();running=true;setStatus("");persist();updateButtons();render();beginAnimation();return;
     }
   }
   activeSource="new";activeEntryId="";selectedEntryId="";baseSeconds=0;startedAt=Date.now();running=true;setStatus("");persist();updateButtons();render();beginAnimation();
 }
 function pauseOrResume(){
   if(running){
     baseSeconds=currentSeconds();running=false;startedAt=0;
     // A saved task must retain the live value shown at the instant it is paused.
     syncActiveEntry(baseSeconds);
     saveCurrentPreset();stopFrame();persist();updateButtons();render();beginAnimation();
   }
   else if(baseSeconds>0){startedAt=Date.now();running=true;persist();updateButtons();render();beginAnimation();}
 }
 function save(){
   const name=taskInput.value.trim(),seconds=currentSeconds();
   if(!name){setStatus("Enter a task name first.");taskInput.focus();return;}
   if(activeSource==="existing"&&activeEntryId){const e=state.entries.find(x=>x.id===activeEntryId);if(e){e.name=name;e.seconds=seconds;}else state.entries.push({id:makeId(),name,seconds});}
   else state.entries.push({id:makeId(),name,seconds});
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();persist();render();updateButtons();renderTimer();setStatus("Saved.");
 }
 function edit(id){
   if(running)return;
   const e=state.entries.find(x=>x.id===id),row=logEl.querySelector('[data-id="'+CSS.escape(id)+'"]');if(!e||!row)return;
   const nameBox=row.querySelector(".name"),durationBox=row.querySelector(".duration");
   nameBox.innerHTML="";durationBox.innerHTML="";
   const nameInput=document.createElement("input");nameInput.type="text";nameInput.maxLength=120;nameInput.value=e.name;nameInput.setAttribute("aria-label","Task name");
   const timeInput=document.createElement("input");timeInput.type="text";timeInput.inputMode="numeric";timeInput.value=fmtInputTime(e.seconds);timeInput.title="HH:MM:SS, MM:SS, or seconds";timeInput.setAttribute("aria-label","Task time: HH:MM:SS");
   nameBox.appendChild(nameInput);durationBox.appendChild(timeInput);nameInput.focus();nameInput.select();
   let done=false,blurTimer=0;
   const commit=()=>{
     if(done||!row.isConnected){done=true;return;}const seconds=parseInputTime(timeInput.value);
     if(seconds===null){setStatus("Use HH:MM:SS, MM:SS, or seconds for time.");timeInput.focus();timeInput.select();return;}
     done=true;const name=nameInput.value.trim();if(name)e.name=name;e.seconds=seconds;
     if(activeSource==="existing"&&activeEntryId===id){baseSeconds=seconds;startedAt=0;if(selectedEntryId===id)taskInput.value=e.name;}
     persist();render();renderTimer();updateButtons();setStatus("");
   };
   const cancel=()=>{done=true;render();};
   [nameInput,timeInput].forEach(input=>{
     input.addEventListener("keydown",ev=>{if(ev.key==="Enter")commit();else if(ev.key==="Escape")cancel();});
     input.addEventListener("blur",()=>{clearTimeout(blurTimer);blurTimer=setTimeout(()=>{if(!row.contains(document.activeElement))commit();},0);});
   });
 }
 function continueEntry(id){
   if(running)return;
   if(id!==activeEntryId&&baseSeconds>0)flushPausedSession();
   const e=state.entries.find(x=>x.id===id);if(!e)return;
   taskInput.value=e.name;activeSource="existing";activeEntryId=id;selectedEntryId=id;baseSeconds=Math.max(0,Number(e.seconds)||0);startedAt=Date.now();running=true;setStatus("");persist();updateButtons();render();beginAnimation();
 }
 function resetEntry(id){
   const e=state.entries.find(x=>x.id===id);if(!e)return;
   e.seconds=0;
   if(activeSource==="existing"&&activeEntryId===id){running=false;startedAt=0;baseSeconds=0;selectedEntryId=id;taskInput.value=e.name;stopFrame();}
   else if(selectedEntryId===id){activeSource="existing";activeEntryId=id;baseSeconds=0;startedAt=0;taskInput.value=e.name;}
   saveCurrentPreset();persist();render();renderTimer();updateButtons();
 }
 function deleteEntry(id){
   state.entries=state.entries.filter(e=>e.id!==id);
   if(activeSource==="existing"&&activeEntryId===id){running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();}
   else if(selectedEntryId===id){selectedEntryId="";baseSeconds=0;taskInput.value="";}
   persist();render();renderTimer();updateButtons();
 }
 function makeId(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}}
 function btn(label,title,cls=""){const b=document.createElement("button");b.type="button";b.textContent=label;b.title=title;b.setAttribute("aria-label",title);if(cls)b.className=cls;return b;}
 function selectEntry(id){
   if(running){
     if(activeSource==="existing"&&activeEntryId===id)return;
     setStatus("Pause the current task before selecting another.");
     return;
   }
   // Switching away from a paused task is also a save action.  This prevents
   // elapsed time from being discarded merely because the main Save button was
   // not pressed first.
   if(id!==activeEntryId&&baseSeconds>0)flushPausedSession();
   const e=state.entries.find(x=>x.id===id);if(!e)return;
   selectedEntryId=id;activeSource="existing";activeEntryId=id;baseSeconds=Math.max(0,Number(e.seconds)||0);startedAt=0;
   taskInput.value=e.name;setStatus("");persist();render();updateButtons();renderTimer();
 }
 function reorder(fromId,toId){
   if(!fromId||!toId||fromId===toId)return;
   const from=state.entries.findIndex(e=>e.id===fromId),to=state.entries.findIndex(e=>e.id===toId);
   if(from<0||to<0)return;
   const [item]=state.entries.splice(from,1);state.entries.splice(to,0,item);
   persist();render();
 }
 function render(){
   logEl.innerHTML="";
   if(!state.entries.length){const x=document.createElement("div");x.className="empty";x.textContent="No saved tasks yet.";logEl.appendChild(x);}
   else state.entries.forEach(e=>{
     const isSelected=selectedEntryId===e.id;
     const isRunning=isSelected&&running&&activeSource==="existing"&&activeEntryId===e.id;
     const row=document.createElement("div");
     row.className="row"+(isSelected?" selected":"")+(isRunning?" running":"");
     row.dataset.id=e.id;row.draggable=!isRunning;
     row.title=isRunning?"Currently running":"Click to select • Drag to reorder";

     row.addEventListener("click",ev=>{
       if(ev.target.closest("button")||ev.target.closest("input"))return;
       selectEntry(e.id);
     });
     row.addEventListener("dragstart",ev=>{
       dragId=e.id;row.classList.add("dragging");
       if(ev.dataTransfer){ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",e.id);}
     });
     row.addEventListener("dragend",()=>{dragId="";row.classList.remove("dragging");});
     row.addEventListener("dragover",ev=>{ev.preventDefault();if(dragId&&dragId!==e.id)row.classList.add("drag-over");});
     row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
     row.addEventListener("drop",ev=>{ev.preventDefault();row.classList.remove("drag-over");const id=(ev.dataTransfer&&ev.dataTransfer.getData("text/plain"))||dragId;reorder(id,e.id);});

     const name=document.createElement("div");name.className="name";
     const nt=document.createElement("div");nt.className="name-text";nt.textContent=e.name;name.appendChild(nt);
     const dur=document.createElement("div");dur.className="duration";dur.textContent=fmtShort(isRunning?currentSeconds():e.seconds);
     const actions=document.createElement("div");actions.className="row-actions";
     const eb=btn("✎","Edit task name");eb.addEventListener("click",()=>edit(e.id));
     const cb=btn(isRunning?(running?"⏸":"▶"):"▶",isRunning?(running?"Pause task":"Resume task"):(isSelected?"Resume task":"Start task"),isRunning&&running?"is-running":"");
     cb.addEventListener("click",ev=>{ev.stopPropagation();if(isRunning)pauseOrResume();else continueEntry(e.id);});
     const rb=btn("↻","Reset task to zero");rb.addEventListener("click",ev=>{ev.stopPropagation();resetEntry(e.id);});
     const db=btn("×","Delete task","delete");db.addEventListener("click",ev=>{ev.stopPropagation();deleteEntry(e.id);});
     actions.append(eb,cb,rb,db);row.append(name,dur,actions);logEl.appendChild(row);
   });
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   totalEl.textContent=fmt(total);
 }
 function refreshActiveRow(){
   if(activeSource!=="existing"||!activeEntryId)return;
   const row=logEl.querySelector('[data-id="'+CSS.escape(activeEntryId)+'"]');if(!row)return;
   row.classList.toggle("selected",selectedEntryId===activeEntryId);
   row.classList.toggle("running",running);
   const d=row.querySelector(".duration");if(d)d.textContent=fmtShort(currentSeconds());
   const b=row.querySelector(".row-actions button:nth-child(2)");
   if(b){b.textContent=running?"⏸":"▶";b.title=running?"Pause task":"Resume task";b.setAttribute("aria-label",b.title);b.classList.toggle("is-running",running);b.disabled=false;}
 }
 function updateButtons(){
   if(running) startBtn.textContent="⏸ Pause";
   else if(baseSeconds>0) startBtn.textContent="▶ Resume";
   else startBtn.textContent="▶ Start";
   saveBtn.disabled=!taskInput.value.trim();
   taskInput.disabled=running;
 }
 function animationLoop(){
   if(!running)return;
   timerEl.textContent=fmt(currentSeconds());
   refreshActiveRow();
   raf=requestAnimationFrame(animationLoop);
 }
 function beginAnimation(){stopFrame();if(running)raf=requestAnimationFrame(animationLoop);else renderTimer();}
 function legacyCopy(text){
   const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
   ta.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;padding:0;border:0;opacity:0";
   document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
   let copied=false;try{copied=document.execCommand("copy");}catch(e){}ta.remove();return copied;
 }
 async function copyText(text){
   // execCommand must run synchronously inside the button click.  This remains
   // the most compatible path for embedded Notion pages, where Clipboard API
   // permission is often unavailable.
   if(legacyCopy(text)){toast("Copied to clipboard.");return;}
   try{
     if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast("Copied to clipboard.");return;}
   }catch(e){}
   toast("Copy is blocked by this embed. Open the widget directly, then copy.");
 }
 function copyLog(){
   if(!state.entries.length){toast("Nothing to copy.");return;}
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   copyText(["⏱ Time Tracking","",...state.entries.map(e=>"- "+e.name+": "+fmtShort(e.seconds)),"","==> Total: "+fmtShort(total)].join("\n"));
 }
 function copyTable(){
   if(!state.entries.length){toast("Nothing to copy.");return;}
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   const lines=["⏱ Time Tracking","","Task | Time","--- | ---",...state.entries.map(e=>e.name+" | "+fmtShort(e.seconds)),"","==> Total: "+fmtShort(total)];
   copyText(lines.join("\n"));
 }
 function resetLog(){
   state.entries.forEach(e=>e.seconds=0);
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";
   saveCurrentPreset();stopFrame();persist();render();renderTimer();updateButtons();
 }
 function clearLog(){
   state.entries=[];if(!state.presets.length){state.currentPresetId="";state.currentPresetName="MH 01";}running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";selectedEntryId="";taskInput.value="";stopFrame();persist();render();renderPresets();renderTimer();updateButtons();
 }
 function toast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add("show");toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1400);}

 startBtn.addEventListener("click",()=>{if(running||baseSeconds>0)pauseOrResume();else startNew();});saveBtn.addEventListener("click",save);savePresetBtn.addEventListener("click",savePreset);createPresetBtn.addEventListener("click",createPreset);duplicatePresetBtn.addEventListener("click",duplicatePreset);presetSelect.addEventListener("change",()=>loadPreset(presetSelect.value));renamePresetBtn.addEventListener("click",()=>renamePreset());deletePresetBtn.addEventListener("click",deletePreset);$("copyLog").addEventListener("click",copyLog);$("copyTable").addEventListener("click",copyTable);$("resetLog").addEventListener("click",resetLog);$("clear").addEventListener("click",clearLog);
 taskInput.addEventListener("input",()=>{if(!running&&selectedEntryId){const e=state.entries.find(x=>x.id===selectedEntryId);if(!e||taskInput.value.trim()!==e.name){selectedEntryId="";activeSource="new";activeEntryId="";baseSeconds=0;}}updateButtons();renderTimer();});
 taskInput.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();save();}});
 document.addEventListener("keydown",ev=>{
   if(ev.key!=="Enter"||ev.defaultPrevented||ev.isComposing)return;
   const target=ev.target;if(target instanceof Element&&target.closest("input, textarea, select, button, [contenteditable='true']"))return;
   if(running){ev.preventDefault();pauseOrResume();}
   else if(selectedEntryId){ev.preventDefault();continueEntry(selectedEntryId);}
   else if(baseSeconds>0){ev.preventDefault();pauseOrResume();}
 });
 themeBtn.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";applyTheme();});
 document.addEventListener("visibilitychange",()=>{if(document.hidden){if(running){baseSeconds=currentSeconds();startedAt=Date.now();persist();}stopFrame();}else{beginAnimation();render();updateButtons();}});
 window.addEventListener("beforeunload",()=>{if(running){baseSeconds=currentSeconds();startedAt=Date.now();}persist();});
 applyTheme();render();renderPresets();updateButtons();beginAnimation();
})();
</script>
