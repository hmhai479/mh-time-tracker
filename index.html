<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MH Time Tracker</title>
<style>
:root{
  --bg:#f6f6f6;--card:#fff;--input:#f0f0f0;--text:#171717;--muted:#737373;
  --border:#d4d4d4;--timer:#171717;--accent:#16a34a;--accent-hover:#15803d;
  --button:#fff;--button-hover:#ededed;--accent-bg:#dcfce7;--danger:#dc2626;
}
:root.dark{
  --bg:#151515;--card:#202020;--input:#181818;--text:#f5f5f5;--muted:#a3a3a3;
  --border:#3a3a3a;--timer:#fff;--accent:#22c55e;--accent-hover:#16a34a;
  --button:#242424;--button-hover:#2e2e2e;--accent-bg:#12351f;--danger:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100%}
button,input{font:inherit}
.app{width:100%;max-width:760px;margin:0 auto;padding:10px 14px 14px;background:var(--bg)}
.topbar{display:flex;justify-content:flex-end;height:28px;margin-bottom:2px}
.theme-btn{width:34px;height:30px;padding:0;border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:8px;cursor:pointer;line-height:1}
.theme-btn:hover{background:var(--button-hover)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:10px 12px;font-size:15px;outline:none;transition:border-color .12s,background .12s}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]:disabled{opacity:.9}
.timer{display:flex;justify-content:center;align-items:baseline;color:var(--timer);font-variant-numeric:tabular-nums;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:clamp(40px,8vw,68px);font-weight:600;letter-spacing:-3px;line-height:1;margin:17px 0 15px;min-height:68px}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button.action{border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:9px;padding:10px 15px;font-size:14px;cursor:pointer;min-height:40px}
button.action:hover{background:var(--button-hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover)}
button:disabled{opacity:.42;cursor:not-allowed}
.status{text-align:center;color:var(--muted);font-size:12px;min-height:15px;margin:6px 0 8px}
.section{border-top:1px solid var(--border);padding-top:11px;margin-top:5px}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.log{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 8px;transition:border-color .12s,background .12s,box-shadow .12s}
.row.running{border:2px solid var(--accent);padding:6px 7px;background:var(--accent-bg);box-shadow:0 0 0 2px rgba(34,197,94,.13)}
.name{min-width:0}
.name input{padding:6px 8px;font-size:14px}
.name-text{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.running .name-text{font-weight:700}
.duration{font-variant-numeric:tabular-nums;font-family:"SFMono-Regular",Consolas,monospace;color:var(--text);font-size:12px;white-space:nowrap}
.row.running .duration{color:var(--accent);font-weight:800}
.row.running .duration::before{content:"● ";font-size:8px}
.row-actions{display:flex;gap:4px}
.row-actions button{width:29px;height:29px;padding:0;border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:7px;cursor:pointer}
.row-actions button:hover{background:var(--button-hover)}
.row-actions button.is-running{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:800;box-shadow:0 0 0 2px var(--accent-bg)}
.row-actions button.delete:hover{color:var(--danger);border-color:var(--danger)}
.total{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:12px}
.total strong{color:var(--text);font-variant-numeric:tabular-nums;font-family:"SFMono-Regular",Consolas,monospace}
.bottom{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:9px}
.bottom button{border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:7px;font-size:11px;padding:7px 9px;cursor:pointer}
.bottom button:hover{background:var(--button-hover)}
.empty{color:var(--muted);font-size:12px;padding:7px 1px}
.toast{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:8px;padding:7px 11px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
.toast.show{opacity:1}
@media(max-width:430px){
 .app{padding:9px 10px 12px}.timer{font-size:42px;letter-spacing:-2px;min-height:50px;margin:14px 0}.row{grid-template-columns:minmax(0,1fr) auto}.duration{justify-self:end}.row-actions{grid-column:1/-1;justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="tracker">
  <div class="topbar"><button class="theme-btn" id="theme" type="button" aria-label="Switch to dark mode">☾</button></div>
  <label for="task">Task</label>
  <input id="task" type="text" maxlength="120" placeholder="e.g. Rigging" autocomplete="off">
  <div class="timer" id="timer">00:00:00.00</div>
  <div class="actions">
    <button id="start" class="action primary" type="button">▶ Start</button>
    <button id="pause" class="action" type="button" hidden>⏸ Pause</button>
    <button id="save" class="action" type="button" disabled>Save session</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <section class="section">
    <div class="section-title">WORK LOG</div>
    <div class="log" id="log"></div>
    <div class="total"><span>TOTAL</span><strong id="total">00:00:00.00</strong></div>
    <div class="bottom">
      <button id="copyLog" type="button">Copy Log</button>
      <button id="copyTable" type="button">Copy Table</button>
      <button id="clear" type="button">Clear Log</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(()=>{
 "use strict";
 const KEY="mh-time-tracker-v6", OLD_KEYS=["mh-time-tracker-v4","mh-time-tracker-v3","mh-time-tracker-v2","mh-time-tracker-v1"];
 const $=id=>document.getElementById(id);
 const taskInput=$("task"),timerEl=$("timer"),startBtn=$("start"),pauseBtn=$("pause"),saveBtn=$("save"),statusEl=$("status"),logEl=$("log"),totalEl=$("total"),toastEl=$("toast"),themeBtn=$("theme");
 let state=loadState();
 let running=Boolean(state.active?.running);
 let startedAt=Number(state.active?.startedAt)||0;
 let baseSeconds=Number(state.active?.baseSeconds)||0;
 let activeSource=state.active?.source==="existing"?"existing":"new";
 let activeEntryId=state.active?.entryId||"";
 let raf=0,toastTimer=0,theme=loadTheme();

 function normalize(data){
   if(!data||!Array.isArray(data.entries)) return null;
   return {entries:data.entries.map(e=>({id:String(e.id||makeId()),name:String(e.name||"Untitled"),seconds:Math.max(0,Number(e.seconds)||0)})),active:data.active||null};
 }
 function loadState(){
   try{
     let raw=localStorage.getItem(KEY); if(raw){const d=normalize(JSON.parse(raw));if(d)return d;}
     for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw){const d=normalize(JSON.parse(raw));if(d)return d;}}
   }catch(e){}
   return {entries:[],active:null};
 }
 function persist(){try{localStorage.setItem(KEY,JSON.stringify({entries:state.entries,active:(running||baseSeconds>0||activeEntryId)?{running,startedAt,baseSeconds,source:activeSource,entryId:activeEntryId}:null}));}catch(e){}}
 function loadTheme(){try{const s=localStorage.getItem("mh-time-tracker-theme");if(s==="dark"||s==="light")return s;}catch(e){}return "light";}
 function applyTheme(){document.documentElement.classList.toggle("dark",theme==="dark");themeBtn.textContent=theme==="dark"?"☀":"☾";themeBtn.setAttribute("aria-label",theme==="dark"?"Switch to light mode":"Switch to dark mode");try{localStorage.setItem("mh-time-tracker-theme",theme);}catch(e){}}
 function fmt(seconds){seconds=Math.max(0,Number(seconds)||0);let hh=Math.floor((seconds%1)*100);let w=Math.floor(seconds),s=w%60;w=Math.floor(w/60);let m=w%60,h=Math.floor(w/60);return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":")+"."+String(hh).padStart(2,"0");}
 function fmtShort(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));let s=seconds%60,tm=Math.floor(seconds/60),m=tm%60,h=Math.floor(tm/60),p=[];if(h)p.push(h+"h");if(m||h)p.push(m+"m");if(!h&&!m)p.push(s+"s");else if(s)p.push(s+"s");return p.join(" ");}
 function currentSeconds(){return running?Math.max(0,baseSeconds+(Date.now()-startedAt)/1000):Math.max(0,baseSeconds);}
 function stopFrame(){if(raf){cancelAnimationFrame(raf);raf=0;}}
 function setStatus(t=""){statusEl.textContent=t;}
 function renderTimer(){timerEl.textContent=fmt(currentSeconds());if(running)raf=requestAnimationFrame(renderTimer);}

 function startNew(){
   const name=taskInput.value.trim();if(!name){setStatus("Enter a task name first.");taskInput.focus();return;}
   activeSource="new";activeEntryId="";baseSeconds=0;startedAt=Date.now();running=true;setStatus("");persist();updateButtons();render();stopFrame();renderTimer();
 }
 function pauseOrResume(){
   if(running){baseSeconds=currentSeconds();running=false;startedAt=0;stopFrame();persist();updateButtons();render();renderTimer();}
   else if(baseSeconds>0){startedAt=Date.now();running=true;persist();updateButtons();render();stopFrame();renderTimer();}
 }
 function save(){
   const name=taskInput.value.trim(),seconds=currentSeconds();
   if(!name){setStatus("Enter a task name first.");taskInput.focus();return;}
   if(seconds<=0){setStatus("Track some time before saving.");return;}
   if(activeSource==="existing"&&activeEntryId){const e=state.entries.find(x=>x.id===activeEntryId);if(e){e.name=name;e.seconds=seconds;}else state.entries.push({id:makeId(),name,seconds});}
   else state.entries.push({id:makeId(),name,seconds});
   running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";taskInput.value="";stopFrame();persist();render();updateButtons();renderTimer();setStatus("Saved.");
 }
 function edit(id){
   if(running)return;
   const e=state.entries.find(x=>x.id===id),row=logEl.querySelector('[data-id="'+CSS.escape(id)+'"]');if(!e||!row)return;
   const box=row.querySelector(".name");box.innerHTML="";const input=document.createElement("input");input.type="text";input.maxLength=120;input.value=e.name;input.setAttribute("aria-label","Task name");box.appendChild(input);input.focus();input.select();
   let done=false;const commit=()=>{if(done)return;done=true;const n=input.value.trim();if(n)e.name=n;persist();render();};input.addEventListener("keydown",ev=>{if(ev.key==="Enter")commit();else if(ev.key==="Escape"){done=true;render();}});input.addEventListener("blur",commit);
 }
 function continueEntry(id){
   if(running)return;
   const e=state.entries.find(x=>x.id===id);if(!e)return;
   taskInput.value=e.name;activeSource="existing";activeEntryId=id;baseSeconds=Math.max(0,Number(e.seconds)||0);startedAt=Date.now();running=true;setStatus("");persist();updateButtons();render();stopFrame();renderTimer();
 }
 function resetEntry(id){
   const e=state.entries.find(x=>x.id===id);if(!e)return;
   e.seconds=0;
   if(activeSource==="existing"&&activeEntryId===id){running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";taskInput.value="";stopFrame();}
   persist();render();renderTimer();updateButtons();
 }
 function deleteEntry(id){
   state.entries=state.entries.filter(e=>e.id!==id);
   if(activeSource==="existing"&&activeEntryId===id){running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";taskInput.value="";stopFrame();}
   persist();render();renderTimer();updateButtons();
 }
 function makeId(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}}
 function btn(label,title,cls=""){const b=document.createElement("button");b.type="button";b.textContent=label;b.title=title;b.setAttribute("aria-label",title);if(cls)b.className=cls;return b;}
 function render(){
   logEl.innerHTML="";
   if(!state.entries.length){const x=document.createElement("div");x.className="empty";x.textContent="No saved tasks yet.";logEl.appendChild(x);}
   else state.entries.forEach(e=>{
     const row=document.createElement("div"),isSelected=activeSource==="existing"&&activeEntryId===e.id;
     row.className="row"+(isSelected?" running":"");row.dataset.id=e.id;
     const name=document.createElement("div");name.className="name";const nt=document.createElement("div");nt.className="name-text";nt.textContent=e.name;name.appendChild(nt);
     const dur=document.createElement("div");dur.className="duration";dur.textContent=fmtShort(isSelected?currentSeconds():e.seconds);
     const actions=document.createElement("div");actions.className="row-actions";
     const eb=btn("✎","Edit task name");eb.addEventListener("click",()=>edit(e.id));
     const cb=btn(isSelected&&running?"⏸":"▶",isSelected?(running?"Pause task":"Resume task"):"Start task",isSelected&&running?"is-running":"");
     cb.addEventListener("click",()=>{
       if(isSelected) pauseOrResume();
       else continueEntry(e.id);
     });
     const rb=btn("↻","Reset task to zero");rb.addEventListener("click",()=>resetEntry(e.id));
     const db=btn("×","Delete task","delete");db.addEventListener("click",()=>deleteEntry(e.id));
     actions.append(eb,cb,rb,db);row.append(name,dur,actions);logEl.appendChild(row);
   });
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   totalEl.textContent=fmt(total);
 }
 function refreshActiveRow(){
   if(activeSource!=="existing"||!activeEntryId)return;
   const row=logEl.querySelector('[data-id="'+CSS.escape(activeEntryId)+'"]');if(!row)return;
   row.classList.add("running");
   const d=row.querySelector(".duration");if(d)d.textContent=fmtShort(currentSeconds());
   const b=row.querySelector(".row-actions button:nth-child(2)");if(b){b.textContent=running?"⏸":"▶";b.title=running?"Pause task":"Resume task";b.setAttribute("aria-label",b.title);b.classList.toggle("is-running",running);b.disabled=false;}
 }
 function updateButtons(){
   startBtn.hidden=running||baseSeconds>0;
   pauseBtn.hidden=!(running||baseSeconds>0);
   pauseBtn.textContent=running?"⏸ Pause":"▶ Resume";
   saveBtn.disabled=currentSeconds()<=0||!taskInput.value.trim();
   taskInput.disabled=running;
 }
 function animationLoop(){
   if(!running)return;
   timerEl.textContent=fmt(currentSeconds());
   refreshActiveRow();
   raf=requestAnimationFrame(animationLoop);
 }
 function beginAnimation(){stopFrame();if(running)raf=requestAnimationFrame(animationLoop);else renderTimer();}
 async function copyText(text){
   try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}toast("Copied to clipboard.");}catch(e){toast("Copy failed.");}
 }
 function copyLog(){
   if(!state.entries.length){toast("Nothing to copy.");return;}
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   copyText(["Time Tracking","",...state.entries.map(e=>"- "+e.name+": "+fmtShort(e.seconds)),"","==> Total: "+fmtShort(total)].join("\n"));
 }
 function copyTable(){
   if(!state.entries.length){toast("Nothing to copy.");return;}
   const total=state.entries.reduce((a,e)=>a+Math.max(0,Number(e.seconds)||0),0);
   const lines=["Time Tracking","","Task: Time",...state.entries.map(e=>e.name+": "+fmtShort(e.seconds)),"","==> Total: "+fmtShort(total)];
   copyText(lines.join("\n"));
 }
 function clearLog(){
   state.entries=[];running=false;startedAt=0;baseSeconds=0;activeSource="new";activeEntryId="";taskInput.value="";stopFrame();persist();render();renderTimer();updateButtons();
 }
 function toast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add("show");toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1400);}

 startBtn.addEventListener("click",startNew);pauseBtn.addEventListener("click",pauseOrResume);saveBtn.addEventListener("click",save);$("copyLog").addEventListener("click",copyLog);$("copyTable").addEventListener("click",copyTable);$("clear").addEventListener("click",clearLog);taskInput.addEventListener("input",updateButtons);themeBtn.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";applyTheme();});
 document.addEventListener("visibilitychange",()=>{if(document.hidden){if(running){baseSeconds=currentSeconds();startedAt=Date.now();persist();}stopFrame();}else{beginAnimation();render();updateButtons();}});
 window.addEventListener("beforeunload",()=>{if(running){baseSeconds=currentSeconds();startedAt=Date.now();}persist();});
 applyTheme();render();updateButtons();beginAnimation();
})();
</script>
</body>
</html>
